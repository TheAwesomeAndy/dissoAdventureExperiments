name: apply-audit-source-fixes

on:
  push:
    branches: ["fix/ci-and-confirmatory-audit"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-and-confirmatory-audit
          fetch-depth: 0

      - name: Apply exact source corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected source fragment not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "chapter4Experiments/run_chapter4_experiments.py",
              """    print(f"  BSC6+PCA64: {rob_res['bsc6'].mean()*100:.1f}% ± {rob_res['bsc6'].std()*100:.1f}%")
    print(f"  MFR:        {rob_res['mfr'].mean()*100:.1f}% ± {rob_res['mfr'].std()*100:.1f}%")""",
              """    print(f"  BSC6+PCA64: {np.mean(rob_res['bsc6'])*100:.1f}% ± {np.std(rob_res['bsc6'])*100:.1f}%")
    print(f"  MFR:        {np.mean(rob_res['mfr'])*100:.1f}% ± {np.std(rob_res['mfr'])*100:.1f}%")""",
          )

          for path in (
              "chapter7Experiments/run_chapter7_experiment_B.py",
              "chapter7Experiments/run_chapter7_experiment_C.py",
          ):
              replace(
                  path,
                  "FIGURE_DIR = '/mnt/user-data/outputs/pictures/chSynthesis'",
                  "REPO_ROOT = os.path.dirname(SCRIPT_DIR)\nFIGURE_DIR = os.environ.get(\n    'ARSPI_FIGURE_DIR', os.path.join(REPO_ROOT, 'pictures', 'chSynthesis'))",
              )

          replace(
              "chapter7Experiments/verify_chapter7.py",
              "synth_fig_dir = \"/mnt/user-data/outputs/pictures/chSynthesis\"",
              "synth_fig_dir = os.path.join(repo_root, \"pictures\", \"chSynthesis\")",
          )

          replace(
              "chapter7Experiments/verify_chapter7.py",
              """    out_b = r_b.stdout + r_b.stderr
    check("Experiment B exits cleanly", r_b.returncode == 0,
          f"exit code {r_b.returncode}")""",
              """    out_b = r_b.stdout + r_b.stderr
    if r_b.returncode != 0:
        print(out_b)
    check("Experiment B exits cleanly", r_b.returncode == 0,
          f"exit code {r_b.returncode}")""",
          )

          replace(
              "chapter7Experiments/verify_chapter7.py",
              """    out_c = r_c.stdout + r_c.stderr
    check("Experiment C exits cleanly", r_c.returncode == 0,
          f"exit code {r_c.returncode}")""",
              """    out_c = r_c.stdout + r_c.stderr
    if r_c.returncode != 0:
        print(out_c)
    check("Experiment C exits cleanly", r_c.returncode == 0,
          f"exit code {r_c.returncode}")""",
          )
          PY

      - name: Commit source corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapter4Experiments/run_chapter4_experiments.py \
                  chapter7Experiments/run_chapter7_experiment_B.py \
                  chapter7Experiments/run_chapter7_experiment_C.py \
                  chapter7Experiments/verify_chapter7.py
          git commit -m "fix: repair Chapter 4 summary and portable Chapter 7 outputs"
          git push origin HEAD:fix/ci-and-confirmatory-audit
