name: verify

# Data-independent verification for every branch, pull request, and release tag.
# Restricted SHAPE data are not required by this workflow.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4

      - name: Apply final source and provenance corrections
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/confirmatory-reproduction-final'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          chapter4 = Path("chapter4Experiments/run_chapter4_experiments.py")
          text = chapter4.read_text(encoding="utf-8")
          old = 'ax.boxplot(data, labels=["MFR", "BSC$_3$", "BSC$_6$+PCA-64"], patch_artist=True, widths=0.4)'
          new = 'ax.boxplot(data, tick_labels=["MFR", "BSC$_3$", "BSC$_6$+PCA-64"], patch_artist=True, widths=0.4)'
          if old in text:
              chapter4.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Chapter 4 boxplot call was not found")

          manifest_path = Path("results_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["reproduction_status"] = {
              "canonical_runner": "experiments/confirmatory/run_confirmatory_validation.py",
              "public_ci_scope": "Synthetic and data-independent implementation verification only; restricted SHAPE records are not available to CI.",
              "authorized_data_requirement": "Before the frozen release, run the canonical runner on the audited SHAPE cohort and require check_against_manifest.py to complete without mismatches.",
              "empirical_regeneration_status": "Not established by the public CI record. Do not describe the committed runner as reproducing the headline values until the authorized-data execution record is retained."
          }
          execution_status = (
              "The canonical runner and data-independent verification are committed. "
              "Exact agreement with this recorded empirical value requires an authorized-data "
              "execution followed by check_against_manifest.py; synthetic CI does not reproduce "
              "the SHAPE result."
          )
          for result in manifest.get("results", []):
              if result.get("tier") == "confirmatory":
                  result["execution_status"] = execution_status
                  notes = result.get("notes")
                  if isinstance(notes, str) and notes.startswith(
                      "Regenerated by the committed confirmatory runner"
                  ):
                      result["notes"] = execution_status
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit final source and provenance corrections
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/confirmatory-reproduction-final'
        run: |
          if git diff --quiet; then
            echo "Corrections already present."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add chapter4Experiments/run_chapter4_experiments.py results_manifest.json
            git commit -m "fix: complete Chapter 4 compatibility and bound reproduction status"
            git push origin HEAD:fix/confirmatory-reproduction-final
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.0" "scipy>=1.13" "scikit-learn>=1.5" \
                      "pandas>=2.2.3" "matplotlib>=3.9"

      - name: Prepare verifier logs
        run: mkdir -p ci-logs

      - name: Verify Chapter 4 core
        id: ch4
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter4Experiments/verify_chapter4.py 2>&1 | tee ci-logs/ch4.log

      - name: Verify Chapter 5 core
        id: ch5
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter5Experiments/verify_chapter5.py 2>&1 | tee ci-logs/ch5.log

      - name: Verify Chapter 5 experiment zero
        id: ch5zero
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter5Experiments/verify_experiment_zero.py 2>&1 | tee ci-logs/ch5zero.log

      - name: Verify Chapter 5 reproduction
        id: ch5repro
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter5Experiments/verify_reproduce_chapter5.py 2>&1 | tee ci-logs/ch5repro.log

      - name: Verify Chapter 5 baselines
        id: ch5base
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter5Experiments/verify_baselines.py 2>&1 | tee ci-logs/ch5base.log

      - name: Verify Chapter 6 core
        id: ch6
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter6Experiments/verify_chapter6.py 2>&1 | tee ci-logs/ch6.log

      - name: Verify Chapter 6 reproduction
        id: ch6repro
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter6Experiments/verify_reproduce_chapter6.py 2>&1 | tee ci-logs/ch6repro.log

      - name: Verify Chapter 7 experiments
        id: ch7
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter7Experiments/verify_chapter7.py 2>&1 | tee ci-logs/ch7.log

      - name: Verify Chapter 7 utilities
        id: ch7util
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter7Experiments/verify_extract_utilities.py 2>&1 | tee ci-logs/ch7util.log

      - name: Verify four-category extension
        id: fourcat
        continue-on-error: true
        run: |
          set -o pipefail
          python experiments/ch5_4class/verify_ch5_4class.py 2>&1 | tee ci-logs/fourcat.log

      - name: Verify three-condition Chapter 6/7 extension
        id: threecond
        continue-on-error: true
        run: |
          set -o pipefail
          python experiments/ch6_ch7_3class/verify_ch6_ch7_3class.py 2>&1 | tee ci-logs/threecond.log

      - name: Verify ablation pipeline
        id: ablation
        continue-on-error: true
        run: |
          set -o pipefail
          python experiments/ablation/verify_ablation.py 2>&1 | tee ci-logs/ablation.log

      - name: Verify validators
        id: validators
        continue-on-error: true
        run: |
          set -o pipefail
          python validation/verify_validators.py 2>&1 | tee ci-logs/validators.log

      - name: Verify confirmatory pipeline
        id: confirmatory
        continue-on-error: true
        run: |
          set -o pipefail
          python experiments/confirmatory/verify_confirmatory.py 2>&1 | tee ci-logs/confirmatory.log

      - name: Check confirmatory manifest provenance
        id: manifest
        continue-on-error: true
        run: |
          set -o pipefail
          python experiments/confirmatory/check_against_manifest.py 2>&1 | tee ci-logs/manifest.log

      - name: Check repository and dissertation consistency
        id: claims
        continue-on-error: true
        run: |
          set -o pipefail
          python validation/validate_dissertation_claims.py 2>&1 | tee ci-logs/claims.log

      - name: Upload verifier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-logs
          path: ci-logs/
          if-no-files-found: error

      - name: Require every verifier to pass
        if: always()
        run: |
          outcomes=(
            "${{ steps.ch4.outcome }}" "${{ steps.ch5.outcome }}"
            "${{ steps.ch5zero.outcome }}" "${{ steps.ch5repro.outcome }}"
            "${{ steps.ch5base.outcome }}" "${{ steps.ch6.outcome }}"
            "${{ steps.ch6repro.outcome }}" "${{ steps.ch7.outcome }}"
            "${{ steps.ch7util.outcome }}" "${{ steps.fourcat.outcome }}"
            "${{ steps.threecond.outcome }}" "${{ steps.ablation.outcome }}"
            "${{ steps.validators.outcome }}" "${{ steps.confirmatory.outcome }}"
            "${{ steps.manifest.outcome }}" "${{ steps.claims.outcome }}"
          )
          printf 'Verifier outcomes: %s\n' "${outcomes[*]}"
          for outcome in "${outcomes[@]}"; do
            test "$outcome" = "success" || exit 1
          done
