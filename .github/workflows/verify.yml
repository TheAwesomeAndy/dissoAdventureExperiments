name: verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-and-confirmatory-audit
          fetch-depth: 0

      - name: Apply exact source corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected source fragment not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "chapter4Experiments/run_chapter4_experiments.py",
              """    print(f"  BSC6+PCA64: {rob_res['bsc6'].mean()*100:.1f}% ± {rob_res['bsc6'].std()*100:.1f}%")
    print(f"  MFR:        {rob_res['mfr'].mean()*100:.1f}% ± {rob_res['mfr'].std()*100:.1f}%")""",
              """    print(f"  BSC6+PCA64: {np.mean(rob_res['bsc6'])*100:.1f}% ± {np.std(rob_res['bsc6'])*100:.1f}%")
    print(f"  MFR:        {np.mean(rob_res['mfr'])*100:.1f}% ± {np.std(rob_res['mfr'])*100:.1f}%")""",
          )

          for path in (
              "chapter7Experiments/run_chapter7_experiment_B.py",
              "chapter7Experiments/run_chapter7_experiment_C.py",
          ):
              replace(
                  path,
                  "FIGURE_DIR = '/mnt/user-data/outputs/pictures/chSynthesis'",
                  "REPO_ROOT = os.path.dirname(SCRIPT_DIR)\nFIGURE_DIR = os.environ.get(\n    'ARSPI_FIGURE_DIR', os.path.join(REPO_ROOT, 'pictures', 'chSynthesis'))",
              )

          replace(
              "chapter7Experiments/verify_chapter7.py",
              "synth_fig_dir = \"/mnt/user-data/outputs/pictures/chSynthesis\"",
              "synth_fig_dir = os.path.join(repo_root, \"pictures\", \"chSynthesis\")",
          )

          replace(
              "chapter7Experiments/verify_chapter7.py",
              """    out_b = r_b.stdout + r_b.stderr
    check("Experiment B exits cleanly", r_b.returncode == 0,
          f"exit code {r_b.returncode}")""",
              """    out_b = r_b.stdout + r_b.stderr
    if r_b.returncode != 0:
        print(out_b)
    check("Experiment B exits cleanly", r_b.returncode == 0,
          f"exit code {r_b.returncode}")""",
          )

          replace(
              "chapter7Experiments/verify_chapter7.py",
              """    out_c = r_c.stdout + r_c.stderr
    check("Experiment C exits cleanly", r_c.returncode == 0,
          f"exit code {r_c.returncode}")""",
              """    out_c = r_c.stdout + r_c.stderr
    if r_c.returncode != 0:
        print(out_c)
    check("Experiment C exits cleanly", r_c.returncode == 0,
          f"exit code {r_c.returncode}")""",
          )
          PY

      - name: Commit source corrections
        run: |
          if git diff --quiet; then
            echo "Source corrections already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add chapter4Experiments/run_chapter4_experiments.py \
                    chapter7Experiments/run_chapter7_experiment_B.py \
                    chapter7Experiments/run_chapter7_experiment_C.py \
                    chapter7Experiments/verify_chapter7.py
            git commit -m "fix: repair Chapter 4 summary and portable Chapter 7 outputs"
            git push origin HEAD:fix/ci-and-confirmatory-audit
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.0" "scipy>=1.13" "scikit-learn>=1.5" \
                      "pandas>=2.2.3" "matplotlib>=3.9"

      - name: Prepare verifier logs
        run: mkdir -p ci-logs

      - name: Verify Chapter 4 core
        id: ch4
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter4Experiments/verify_chapter4.py 2>&1 | tee ci-logs/ch4.log

      - name: Verify Chapter 5 core
        id: ch5
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter5Experiments/verify_chapter5.py 2>&1 | tee ci-logs/ch5.log

      - name: Verify Chapter 5 experiment zero
        id: ch5zero
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter5Experiments/verify_experiment_zero.py 2>&1 | tee ci-logs/ch5zero.log

      - name: Verify Chapter 5 reproduction
        id: ch5repro
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter5Experiments/verify_reproduce_chapter5.py 2>&1 | tee ci-logs/ch5repro.log

      - name: Verify Chapter 5 baselines
        id: ch5base
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter5Experiments/verify_baselines.py 2>&1 | tee ci-logs/ch5base.log

      - name: Verify Chapter 6 core
        id: ch6
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter6Experiments/verify_chapter6.py 2>&1 | tee ci-logs/ch6.log

      - name: Verify Chapter 6 reproduction
        id: ch6repro
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter6Experiments/verify_reproduce_chapter6.py 2>&1 | tee ci-logs/ch6repro.log

      - name: Verify Chapter 7 experiments
        id: ch7
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter7Experiments/verify_chapter7.py 2>&1 | tee ci-logs/ch7.log

      - name: Verify Chapter 7 utilities
        id: ch7util
        continue-on-error: true
        run: |
          set -o pipefail
          python chapter7Experiments/verify_extract_utilities.py 2>&1 | tee ci-logs/ch7util.log

      - name: Verify four-category extension
        id: fourcat
        continue-on-error: true
        run: |
          set -o pipefail
          python experiments/ch5_4class/verify_ch5_4class.py 2>&1 | tee ci-logs/fourcat.log

      - name: Verify three-condition Chapter 6/7 extension
        id: threecond
        continue-on-error: true
        run: |
          set -o pipefail
          python experiments/ch6_ch7_3class/verify_ch6_ch7_3class.py 2>&1 | tee ci-logs/threecond.log

      - name: Verify ablation pipeline
        id: ablation
        continue-on-error: true
        run: |
          set -o pipefail
          python experiments/ablation/verify_ablation.py 2>&1 | tee ci-logs/ablation.log

      - name: Verify validators
        id: validators
        continue-on-error: true
        run: |
          set -o pipefail
          python validation/verify_validators.py 2>&1 | tee ci-logs/validators.log

      - name: Verify confirmatory pipeline
        id: confirmatory
        continue-on-error: true
        run: |
          set -o pipefail
          python experiments/confirmatory/verify_confirmatory.py 2>&1 | tee ci-logs/confirmatory.log

      - name: Check confirmatory manifest provenance
        id: manifest
        continue-on-error: true
        run: |
          set -o pipefail
          python experiments/confirmatory/check_against_manifest.py 2>&1 | tee ci-logs/manifest.log

      - name: Check repository and dissertation consistency
        id: claims
        continue-on-error: true
        run: |
          set -o pipefail
          python validation/validate_dissertation_claims.py 2>&1 | tee ci-logs/claims.log

      - name: Upload verifier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-logs
          path: ci-logs/
          if-no-files-found: error

      - name: Require every verifier to pass
        if: always()
        run: |
          outcomes=(
            "${{ steps.ch4.outcome }}" "${{ steps.ch5.outcome }}"
            "${{ steps.ch5zero.outcome }}" "${{ steps.ch5repro.outcome }}"
            "${{ steps.ch5base.outcome }}" "${{ steps.ch6.outcome }}"
            "${{ steps.ch6repro.outcome }}" "${{ steps.ch7.outcome }}"
            "${{ steps.ch7util.outcome }}" "${{ steps.fourcat.outcome }}"
            "${{ steps.threecond.outcome }}" "${{ steps.ablation.outcome }}"
            "${{ steps.validators.outcome }}" "${{ steps.confirmatory.outcome }}"
            "${{ steps.manifest.outcome }}" "${{ steps.claims.outcome }}"
          )
          printf 'Verifier outcomes: %s\n' "${outcomes[*]}"
          for outcome in "${outcomes[@]}"; do
            test "$outcome" = "success" || exit 1
          done
