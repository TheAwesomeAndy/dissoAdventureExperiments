name: verify

# Runs the data-independent verification suite on every push, pull request,
# and release tag, so the exact archived commit carries a visible green check.
# None of these tests require the restricted SHAPE dataset.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.0" "scipy>=1.13" "scikit-learn>=1.5" \
                      "pandas>=2.2.3" "matplotlib>=3.9"

      - name: Verify Chapter 4 core
        run: python chapter4Experiments/verify_chapter4.py

      - name: Verify Chapter 5 core
        run: python chapter5Experiments/verify_chapter5.py

      - name: Verify Chapter 5 experiment zero
        run: python chapter5Experiments/verify_experiment_zero.py

      - name: Verify Chapter 5 reproduction
        run: python chapter5Experiments/verify_reproduce_chapter5.py

      - name: Verify Chapter 5 baselines
        run: python chapter5Experiments/verify_baselines.py

      - name: Verify Chapter 6 core
        run: python chapter6Experiments/verify_chapter6.py

      - name: Verify Chapter 6 reproduction
        run: python chapter6Experiments/verify_reproduce_chapter6.py

      - name: Verify Chapter 7 experiments
        run: python chapter7Experiments/verify_chapter7.py

      - name: Verify Chapter 7 utilities
        run: python chapter7Experiments/verify_extract_utilities.py

      - name: Verify four-category extension
        run: python experiments/ch5_4class/verify_ch5_4class.py

      - name: Verify three-condition Chapter 6/7 extension
        run: python experiments/ch6_ch7_3class/verify_ch6_ch7_3class.py

      - name: Verify ablation pipeline
        run: python experiments/ablation/verify_ablation.py

      - name: Verify validators
        run: python validation/verify_validators.py

      - name: Verify confirmatory pipeline
        run: python experiments/confirmatory/verify_confirmatory.py

      - name: Check confirmatory manifest provenance
        run: python experiments/confirmatory/check_against_manifest.py

      - name: Check repository and dissertation consistency
        run: python validation/validate_dissertation_claims.py
